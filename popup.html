<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PII Guard</title>
  <style>
    body{font:14px/1.5 system-ui,sans-serif;width:290px;margin:0;padding:16px;color:#1f2937}
    h1{font-size:18px;margin:0 0 8px}p{color:#4b5563}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
    button{border:0;border-radius:8px;padding:9px 12px;background:#1d4ed8;color:#fff;font-weight:600;cursor:pointer}
    a{color:#1d4ed8}
    .status{font-weight:700}
  </style>
</head>
<body>
  <h1>PII Guard</h1>
  <p>Warns when common personal information is typed into website fields.</p>
  <div class="row"><span>Protection</span><span class="status" id="status">Loading…</span></div>
  <button id="toggle">Loading…</button>
  <p><a href="options.html" target="_blank">Settings and limitations</a></p>
  <p><small>Detection happens in your browser. Typed text is not sent to a server by this extension.</small></p>
  <script src="popup.js"></script>
</body>
</html>
